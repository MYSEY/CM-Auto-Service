<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1b3e">
    <title>Offline - CM Auto Service</title>
    <link rel="stylesheet" href="build/pwa.css">
</head>
<body class="bg-gray-50 flex justify-center items-center min-h-screen text-gray-800 font-sans m-0 p-0">
    <div class="text-center px-5 py-10 max-w-[400px]">
        <div class="text-[64px] mb-5">&#128225;</div>
        <h1 class="text-2xl font-semibold text-primary mb-3">You're Offline</h1>
        <p class="text-base text-gray-500 mb-7 leading-relaxed">Please check your internet connection and try again.</p>
        <a href="/" class="inline-block px-8 py-3 bg-primary text-white border-none rounded-lg text-base no-underline transition-colors duration-200 hover:bg-primary-light">Retry</a>
    </div>
    <script>
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
